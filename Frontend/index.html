<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e131f" />
    <script>
      try {
        const savedTheme = localStorage.getItem('portfolio-theme')
        const theme = savedTheme === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0e131f' : '#f3f4f6'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <meta name="description" content="Ayush Kumar Singh builds reliable web applications for business workflows using ASP.NET Core, SQL Server, React, and Angular. Explore his projects and experience." />
    <title>Ayush Kumar Singh | ASP.NET Core Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
